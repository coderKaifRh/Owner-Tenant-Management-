<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAK Limited - Sign Up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 30px 15px;
        }
        .signup-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            overflow: hidden;
            width: 100%;
            max-width: 480px;
        }
        .card-header-custom {
            background: #2a5298;
            color: white;
            padding: 25px 20px;
            text-align: center;
        }
        .btn-custom {
            background: #2a5298;
            color: white;
            border-radius: 8px;
            padding: 12px;
            font-weight: 600;
        }
        .btn-custom:hover {
            background: #1e3c72;
            color: white;
        }
    </style>
</head>
<body>

<div class="signup-card">
    <div class="card-header-custom">
        <h3 class="fw-bold mb-1"><i class="bi bi-person-plus"></i> Create Account</h3>
        <p class="mb-0 text-white-50">Join TAK LIMITED</p>
    </div>

    <div class="card-body p-4">
        <div th:if="${error}" class="alert alert-danger" role="alert">
            <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${error}"></span>
        </div>

        <form th:action="@{/signup}" method="post">
            <div class="mb-3">
                <label class="form-label fw-semibold">I want to register as:</label>
                <div class="d-flex gap-4">
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="role" id="roleTenant" value="Tenant" checked>
                        <label class="form-check-label" for="roleTenant">Tenant (ভাড়াটিয়া)</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="role" id="roleOwner" value="Owner">
                        <label class="form-check-label" for="roleOwner">Owner (মালিক)</label>
                    </div>
                </div>
            </div>

            <div class="mb-3">
                <label for="username" class="form-label fw-semibold">Username</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control" id="username" name="username" placeholder="Choose a username" required>
                </div>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label fw-semibold">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Create password" required>
                </div>
            </div>

            <div class="mb-4">
                <label for="phone" class="form-label fw-semibold">Phone Number</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                    <input type="text" class="form-control" id="phone" name="phone" placeholder="+8801700000000" required>
                </div>
                <div class="form-text">Must be 14 characters starting with +8801</div>
            </div>

            <button type="submit" class="btn btn-custom w-100 mb-3 shadow-sm">
                <i class="bi bi-check2-circle"></i> Complete Registration
            </button>

            <div class="text-center">
                <span class="text-muted">Already have an account? </span>
                <a th:href="@{/login}" class="text-decoration-none fw-semibold">Log In</a>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
