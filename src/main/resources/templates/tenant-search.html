<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Flat - TAK Limited</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .navbar-custom { background: #2a5298; }
        .hero-section {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 50px 0;
            border-radius: 0 0 25px 25px;
            margin-bottom: 40px;
        }
        .search-box {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark navbar-custom shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#"><i class="bi bi-buildings"></i> TAK LIMITED</a>
        <div class="d-flex align-items-center gap-3 text-white">
            <span><i class="bi bi-person-circle"></i> Welcome, <strong th:text="${user.username}">Tenant</strong></span>
            <a th:href="@{/transport}" class="btn btn-outline-light btn-sm"><i class="bi bi-truck"></i> Transport Service</a>
            <a th:href="@{/logout}" class="btn btn-danger btn-sm"><i class="bi bi-box-arrow-right"></i> Logout</a>
        </div>
    </div>
</nav>

<!-- Hero Search Header -->
<div class="hero-section text-center">
    <div class="container">
        <h2 class="fw-bold mb-2">Find Your Ideal Home in Dhaka</h2>
        <p class="text-white-50">Filter properties by location, your budget, and size preferences.</p>
    </div>
</div>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="search-box">
                <h4 class="fw-bold mb-4 text-primary"><i class="bi bi-search"></i> Search Properties</h4>

                <form th:action="@{/tenant/results}" method="get">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Preferred Location</label>
                        <select class="form-select form-select-lg" name="location">
                            <option value="">All Locations</option>
                            <option value="Dhanmondi">Dhanmondi</option>
                            <option value="Mirpur">Mirpur</option>
                            <option value="Uttara">Uttara</option>
                            <option value="Gulshan">Gulshan</option>
                            <option value="Banani">Banani</option>
                            <option value="Mohammadpur">Mohammadpur</option>
                            <option value="Badda">Badda</option>
                            <option value="Bashundhara">Bashundhara</option>
                            <option value="Farmgate">Farmgate</option>
                            <option value="Motijheel">Motijheel</option>
                        </select>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Maximum Budget / Rent (BDT)</label>
                            <input type="number" class="form-control form-control-lg" name="maxRent" id="rentInput" placeholder="e.g. 30000">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Minimum Size (Sq Ft)</label>
                            <input type="number" class="form-control form-control-lg" name="minSize" placeholder="e.g. 1000">
                        </div>
                    </div>

                    <!-- Advance Calculation Notice -->
                    <div class="alert alert-info d-flex align-items-center mb-4">
                        <i class="bi bi-info-circle-fill fs-4 me-3"></i>
                        <div>
                            <strong>Advance Rule:</strong> As a Tenant, 2 months' advance is standard.
                            <span id="advancePreview" class="d-none"> Estimated advance: <strong id="advanceValue" class="text-primary">0</strong> BDT</span>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold shadow-sm">
                        <i class="bi bi-search"></i> Search Available Flats
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('rentInput').addEventListener('input', function() {
        const rent = parseFloat(this.value);
        const preview = document.getElementById('advancePreview');
        const value = document.getElementById('advanceValue');
        if (rent > 0) {
            value.innerText = (rent * 2).toLocaleString();
            preview.classList.remove('d-none');
        } else {
            preview.classList.add('d-none');
        }
    });
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
