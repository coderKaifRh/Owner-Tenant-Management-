<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transport & Moving Service - TAK Limited</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .navbar-custom { background: #2a5298; }
        .transport-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            padding: 35px;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark navbar-custom shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#"><i class="bi bi-buildings"></i> TAK LIMITED</a>
        <div class="d-flex align-items-center gap-3 text-white">
            <a href="javascript:history.back()" class="btn btn-outline-light btn-sm"><i class="bi bi-arrow-left"></i> Go Back</a>
            <a th:href="@{/logout}" class="btn btn-danger btn-sm"><i class="bi bi-box-arrow-right"></i> Logout</a>
        </div>
    </div>
</nav>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="transport-card">
                <div class="text-center mb-4">
                    <i class="bi bi-truck text-primary" style="font-size: 3rem;"></i>
                    <h3 class="fw-bold mt-2">Home Shifting & Transport Fare Calculator</h3>
                    <p class="text-muted">Calculate your moving truck and helper costs upfront.</p>
                </div>

                <div th:if="${error}" class="alert alert-danger" role="alert">
                    <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${error}"></span>
                </div>

                <form th:action="@{/transport/calculate}" method="post">
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Truck Size</label>
                        <select class="form-select form-select-lg" name="size" id="sizeSelect" required>
                            <option value="Small" th:selected="${selectedSize == 'Small'}">Small Pickup (2,000 BDT Base Fare)</option>
                            <option value="Medium" th:selected="${selectedSize == 'Medium'}">Medium Truck (3,500 BDT Base Fare)</option>
                            <option value="Large" th:selected="${selectedSize == 'Large'}">Large Covered Van (5,000 BDT Base Fare)</option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Number of Helpers / Workers</label>
                        <input type="number" class="form-control form-control-lg" name="workers" id="workersInput" min="0" max="10"
                               th:value="${workerCount != null ? workerCount : 2}" placeholder="Number of helpers" required>
                        <div class="form-text">Charge per helper: 800 BDT</div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold shadow-sm mb-3">
                        <i class="bi bi-calculator"></i> Calculate Total Fare
                    </button>
                </form>

                <!-- Calculation Result -->
                <div th:if="${calculated}" class="card bg-light border-primary p-4 rounded-3 text-center mt-4">
                    <h6 class="text-muted text-uppercase fw-bold mb-1">Estimated Shifting Cost</h6>
                    <h2 class="fw-bold text-success display-6 mb-2" th:text="${#numbers.formatDecimal(totalCost, 0, 'COMMA', 0, 'POINT')} + ' BDT'"></h2>
                    <p class="small text-muted mb-3">Includes vehicle base fare and all assigned helpers.</p>
                    <button class="btn btn-success fw-bold" onclick="alert('Transport booking request placed! A representative will call you soon.')">
                        <i class="bi bi-calendar-check"></i> Book Now
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
