<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAK Limited - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            overflow: hidden;
            width: 100%;
            max-width: 440px;
        }
        .card-header-custom {
            background: #2a5298;
            color: white;
            padding: 30px 20px;
            text-align: center;
        }
        .btn-custom {
            background: #2a5298;
            color: white;
            border-radius: 8px;
            padding: 12px;
            font-weight: 600;
        }
        .btn-custom:hover {
            background: #1e3c72;
            color: white;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="card-header-custom">
        <h3 class="fw-bold mb-1"><i class="bi bi-buildings"></i> TAK LIMITED</h3>
        <p class="mb-0 text-white-50">Tenant & Property Management</p>
    </div>

    <div class="card-body p-4">
        <div th:if="${param.registered}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle-fill"></i> Registration successful! Please log in.
        </div>

        <div th:if="${error}" class="alert alert-danger" role="alert">
            <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${error}"></span>
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label fw-semibold">Role</label>
                <div class="d-flex gap-4">
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="role" id="roleTenant" value="Tenant" checked>
                        <label class="form-check-label" for="roleTenant">Tenant</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="role" id="roleOwner" value="Owner">
                        <label class="form-check-label" for="roleOwner">Owner</label>
                    </div>
                </div>
            </div>

            <div class="mb-3">
                <label for="username" class="form-label fw-semibold">Username</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control" id="username" name="username" placeholder="Enter username" required>
                </div>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label fw-semibold">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
                </div>
            </div>

            <button type="submit" class="btn btn-custom w-100 mb-3 shadow-sm">
                <i class="bi bi-box-arrow-in-right"></i> Log In
            </button>

            <div class="text-center">
                <span class="text-muted">Don't have an account? </span>
                <a th:href="@{/signup}" class="text-decoration-none fw-semibold">Sign Up</a>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
